<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">The Venturemorph decision cycle</title>
  <desc id="desc">New evidence is evaluated through product, growth, and brand. The three perspectives inform one coherent direction, up to three improvements, a brand verdict, and one measurable experiment. Results update the project history and inform the next review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#101526"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B8A4FA"/><stop offset=".5" stop-color="#A2D9C7"/><stop offset="1" stop-color="#E9BEA6"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1438" height="898" rx="30" fill="url(#bg)" stroke="#293147"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="72" y="68" fill="#9FADC5" font-size="14" font-weight="600" letter-spacing="3">THE VENTUREMORPH METHOD</text>
    <text x="72" y="121" fill="#F4F5FB" font-size="38" font-weight="650">One change. Every consequence.</text>
    <text x="72" y="160" fill="#A9B4C9" font-size="19">Connect what the product does, how it grows, and what the brand promises.</text>

    <rect x="72" y="205" width="1296" height="94" rx="16" fill="#182035" stroke="#34415C"/>
    <circle cx="108" cy="242" r="5" fill="#C0AFF6"/>
    <text x="130" y="249" fill="#F2F4FB" font-size="21" font-weight="600">Start with new evidence</text>
    <text x="130" y="279" fill="#ABB8CE" font-size="16">A user insight, feature, audience, business model, or experiment result.</text>

    <path d="M720 299 V328 M270 328 H1170 M270 328 V349 M720 328 V349 M1170 328 V349" fill="none" stroke="#62718A" stroke-width="2"/>
    <g fill="#62718A"><path d="M264 343 L270 351 L276 343Z"/><path d="M714 343 L720 351 L726 343Z"/><path d="M1164 343 L1170 351 L1176 343Z"/></g>

    <rect x="72" y="354" width="396" height="160" rx="18" fill="#181C31" stroke="#6B5F96"/>
    <rect x="72" y="354" width="396" height="4" rx="2" fill="#B8A4FA"/>
    <text x="98" y="391" fill="#BFAEF5" font-size="13" font-weight="650" letter-spacing="2.5">01 / PRODUCT</text>
    <text x="98" y="430" fill="#F4F5FB" font-size="26" font-weight="600">What creates value?</text>
    <text x="98" y="465" fill="#AFB8CD" font-size="17">Problem, behavior, delivered benefit.</text>
    <text x="98" y="491" fill="#AFB8CD" font-size="17">Distinguish planned from shipped.</text>

    <rect x="522" y="354" width="396" height="160" rx="18" fill="#14272C" stroke="#486F69"/>
    <rect x="522" y="354" width="396" height="4" rx="2" fill="#A2D9C7"/>
    <text x="548" y="391" fill="#A2D9C7" font-size="13" font-weight="650" letter-spacing="2.5">02 / GROWTH</text>
    <text x="548" y="430" fill="#F4F5FB" font-size="26" font-weight="600">What enables progress?</text>
    <text x="548" y="465" fill="#AFBFC9" font-size="17">Audience, first value, repeat use.</text>
    <text x="548" y="491" fill="#AFBFC9" font-size="17">Find the current bottleneck.</text>

    <rect x="972" y="354" width="396" height="160" rx="18" fill="#2A2328" stroke="#7B665E"/>
    <rect x="972" y="354" width="396" height="4" rx="2" fill="#E9BEA6"/>
    <text x="998" y="391" fill="#E9BEA6" font-size="13" font-weight="650" letter-spacing="2.5">03 / BRAND</text>
    <text x="998" y="430" fill="#F4F5FB" font-size="26" font-weight="600">What should it promise?</text>
    <text x="998" y="465" fill="#C0B8C7" font-size="17">Name, positioning, character.</text>
    <text x="998" y="491" fill="#C0B8C7" font-size="17">Align expression with delivery.</text>

    <path d="M270 514 V543 H1170 V514 M720 514 V563" fill="none" stroke="#62718A" stroke-width="2"/>
    <path d="M714 556 L720 564 L726 556Z" fill="#62718A"/>
    <rect x="72" y="568" width="1296" height="106" rx="18" fill="#1D233A" stroke="#6C7194"/>
    <rect x="72" y="568" width="5" height="106" rx="2" fill="url(#line)"/>
    <text x="102" y="610" fill="#F4F5FB" font-size="25" font-weight="600">Choose one coherent direction</text>
    <text x="102" y="645" fill="#B6C0D5" font-size="17">Up to three priorities. A reasoned brand verdict. A clear tradeoff and reversal condition.</text>
    <path d="M720 674 V707" stroke="#62718A" stroke-width="2"/>
    <path d="M714 700 L720 708 L726 700Z" fill="#62718A"/>

    <rect x="72" y="712" width="800" height="114" rx="18" fill="#172936" stroke="#476576"/>
    <text x="102" y="755" fill="#F4F5FB" font-size="24" font-weight="600">Design one measurable experiment</text>
    <text x="102" y="790" fill="#B2C4CF" font-size="17">Hypothesis, metric, resource cap, guardrail, and decision rules.</text>
    <path d="M872 769 H920" stroke="#62718A" stroke-width="2"/>
    <path d="M913 763 L921 769 L913 775Z" fill="#62718A"/>
    <rect x="926" y="712" width="442" height="114" rx="18" fill="#1E2036" stroke="#6D6691"/>
    <text x="952" y="755" fill="#F4F5FB" font-size="24" font-weight="600">Carry the learning forward</text>
    <text x="952" y="789" fill="#B6B8D0" font-size="17">Results + decisions → next review</text>
    <text x="72" y="866" fill="#98A7C0" font-size="14">Evidence can change the advice. Only explicit acceptance turns a proposal into your decision.</text>
    <text x="1368" y="866" fill="#A6B2C9" font-size="13" text-anchor="end" letter-spacing="2">UFODIA</text>
  </g>
</svg>
