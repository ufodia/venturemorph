name: Validate distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check state template
        run: python skills/venturemorph/scripts/check_state.py skills/venturemorph/assets/project-state.template.json
      - name: Run contract and distribution tests
        run: python -m unittest discover -s tests -v
