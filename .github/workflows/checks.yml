name: Validate distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.8'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.8'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check state template
        run: python skills/venturemorph/scripts/check_state.py skills/venturemorph/assets/project-state.template.json
      - name: Run contract and distribution tests
        run: python -m unittest discover -s tests -v
